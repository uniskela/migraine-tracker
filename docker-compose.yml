name: migraine-tracker
x-runtime: &runtime
  build: .
  image: migraine-tracker:local
  env_file: .env
  environment:
    NODE_ENV: production
    DATA_DIR: /app-data
    PORT: 3000
  volumes:
    - app-data:/app-data
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  app:
    <<: *runtime
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    stop_grace_period: 20s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  backup:
    <<: *runtime
    profiles: ["backups"]
    restart: unless-stopped
    entrypoint: ["sh", "/app/scripts/backup-loop.sh"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
volumes:
  app-data:
