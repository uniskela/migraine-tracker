name: Release Please

# After a trusted merge to main, Release Please opens (or updates) a release PR.
# It never merges that PR itself. When a maintainer merges the release PR,
# Release Please creates the immutable vX.Y.Z tag + GitHub Release, and this
# workflow publishes container images.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.actor == 'uniskela'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    needs: release-please
    if: >-
      github.actor == 'uniskela' &&
      needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  notify-docs:
    needs: release-please
    if: >-
      github.actor == 'uniskela' &&
      needs.release-please.outputs.release_created == 'true'
    permissions: {}
    uses: ./.github/workflows/notify-uniskela-docs.yml
    secrets: inherit
